# Stack de producción (Trozo 8a-1): backend, servicio de IA, frontend, PostgreSQL normal (sin
# pgvector: nada lo usa, ver docs/PROGRESS.md) y Caddy como único punto de entrada, con HTTPS
# automático (Let's Encrypt) cuando DOMAIN es un dominio real.
#
# Uso:
#   cp .env.prod.example .env.prod   # y rellena los valores reales, nunca los de ejemplo
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Solo Caddy publica puertos (80 y 443): el resto de servicios solo son alcanzables entre sí,
# por la red interna de Docker Compose.

name: gymflow-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymflow}
      POSTGRES_USER: ${POSTGRES_USER:-gymflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymflow} -d ${POSTGRES_DB:-gymflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gymflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gymflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.prod}
      GYMFLOW_JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env.prod (openssl rand -base64 48)}
      GYMFLOW_AI_BASE_URL: http://ai-service:8000
      GYMFLOW_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Define PUBLIC_URL en .env.prod}
      GYMFLOW_ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en .env.prod}
      GYMFLOW_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env.prod (mínimo 12 caracteres)}
    expose:
      - "8080"

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gymflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gymflow}
      LLM_BASE_URL: ${LLM_BASE_URL:?Define LLM_BASE_URL en .env.prod}
      LLM_API_KEY: ${LLM_API_KEY:?Define LLM_API_KEY en .env.prod}
      LLM_MODEL: ${LLM_MODEL:?Define LLM_MODEL en .env.prod}
      BACKEND_BASE_URL: http://backend:8080
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js hornea NEXT_PUBLIC_* en el bundle del navegador en tiempo de build: tiene que
        # ser ya la URL pública final, no se puede cambiar luego solo con una variable de entorno.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?Define PUBLIC_URL en .env.prod}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Llamadas del propio servidor de Next.js (Server Components): van directas al backend
      # por la red interna, sin pasar por Caddy ni por el dominio público.
      API_INTERNAL_URL: http://backend:8080
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      # Dominio real (p. ej. "gymflow.ejemplo.com") para HTTPS automático, o una IP / ":80"
      # para una primera prueba en HTTP sin dominio todavía.
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:
