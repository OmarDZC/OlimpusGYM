name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # El runner de GitHub Actions trae Docker, así que los tests de
      # Testcontainers (bloqueados en aislamiento/concurrencia) se ejecutan aquí.
      - name: mvn test
        run: mvn --batch-mode --no-transfer-progress test

  ai-service:
    name: Servicio de IA (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest -v

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo lo que necesitan los tres escenarios de e2e/ (login por rol, reservar/cancelar,
      # cancelación de sesión por staff): ninguno usa IA, así que no hace falta ai-service.
      - name: Levantar Postgres, backend y frontend
        run: docker compose up -d --wait postgres redis rabbitmq backend frontend

      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/public/ping && exit 0
            sleep 2
          done
          echo "El backend no respondió a tiempo" && exit 1

      - name: Esperar a que el frontend responda
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "El frontend no respondió a tiempo" && exit 1

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: npm ci
        working-directory: e2e
        run: npm ci

      - name: Instalar navegador de Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Playwright test
        working-directory: e2e
        run: npx playwright test

      - name: Logs de Docker Compose (si algo falló)
        if: failure()
        run: docker compose logs --tail=300

      - name: Subir el reporte de Playwright (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
