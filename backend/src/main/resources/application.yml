spring:
  application:
    name: gymflow-backend
  # No usamos el UserDetailsService de Spring Security (la autenticación es JWT propia,
  # ver com.gymflow.auth): sin esto, Boot genera un usuario y contraseña aleatorios en
  # cada arranque y los imprime en el log, que nadie usa nunca.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/gymflow
    username: gymflow
    password: gymflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      # Cortos a propósito (Trozo 8a-2): si Redis no responde, el límite de uso de la IA debe
      # fallar rápido y dejar pasar la petición (ver AiUsageLimiter), no dejar al socio
      # esperando segundos por una conexión que no va a llegar. Probado de verdad parando el
      # contenedor de Redis con el stack de producción real arriba.
      connect-timeout: 300ms
      timeout: 300ms

server:
  port: 8080
  # Detrás de Caddy en producción, la petición le llega al backend en HTTP plano aunque el
  # navegador use HTTPS: sin esto, request.isSecure() daría false y la cabecera HSTS (y
  # cualquier redirección a HTTPS) nunca se enviaría. Caddy ya manda X-Forwarded-* de serie.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # Solo salud y métricas básicas (Trozo 8a-2): nada de "info" ni de un formato más
        # detallado tipo Prometheus, que no hace falta todavía. Caddy nunca expone /actuator/**
        # al público (ver Caddyfile: solo /api/* va al backend, lo demás al frontend), así que
        # esto solo es alcanzable desde dentro de la red interna de Docker o con un túnel SSH.
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true

gymflow:
  jwt:
    secret: ${GYMFLOW_JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    expiration-minutes: 60
  ai:
    base-url: ${GYMFLOW_AI_BASE_URL:http://localhost:8000}
    limits:
      # Límite de uso de la IA por socio y día (Trozo 8a-2, LOGIC.md §6/§7): BÁSICA no tiene
      # IA (su tarifa lo bloquea antes de llegar al límite), así que solo hacen falta valores
      # para COMPLETA y ATLETA_PRO (más holgado). Configurable por variable de entorno para
      # poder ajustar la demo pública sin tocar código.
      completa:
        routines-per-day: ${GYMFLOW_AI_LIMIT_COMPLETA_ROUTINES_PER_DAY:5}
        assistant-messages-per-day: ${GYMFLOW_AI_LIMIT_COMPLETA_ASSISTANT_PER_DAY:40}
      atleta-pro:
        routines-per-day: ${GYMFLOW_AI_LIMIT_ATLETA_PRO_ROUTINES_PER_DAY:10}
        assistant-messages-per-day: ${GYMFLOW_AI_LIMIT_ATLETA_PRO_ASSISTANT_PER_DAY:80}
      # Tope diario para toda la aplicación (todas las tarifas y funciones juntas), para no
      # agotar el cupo gratuito del proveedor del LLM si la demo pública recibe mucho tráfico.
      global-daily-cap: ${GYMFLOW_AI_LIMIT_GLOBAL_DAILY_CAP:500}
  cors:
    # Orígenes del frontend con permiso de llamar a la API (coma-separados). En despliegue,
    # cambia esto a la URL pública real del frontend.
    allowed-origins: ${GYMFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    # Administrador real de producción (ProductionAdminSeeder, Trozo 8a-1): vacíos por
    # defecto, solo hacen falta fuera de dev/demo.
    email: ${GYMFLOW_ADMIN_EMAIL:}
    password: ${GYMFLOW_ADMIN_PASSWORD:}
  demo:
    # Despliegue público en modo demo (Trozo 8a-2): contraseñas fuertes de verdad, no las de
    # desarrollo (conocidas, publicadas en el README). Sin prefijo GYMFLOW_ a propósito: así
    # las pide el encargo (DEMO_OWNER_PASSWORD, DEMO_MEMBER_PASSWORD).
    owner-password: ${DEMO_OWNER_PASSWORD:}
    member-password: ${DEMO_MEMBER_PASSWORD:}
