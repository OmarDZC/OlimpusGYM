spring:
  application:
    name: gymflow-backend
  # No usamos el UserDetailsService de Spring Security (la autenticación es JWT propia,
  # ver com.gymflow.auth): sin esto, Boot genera un usuario y contraseña aleatorios en
  # cada arranque y los imprime en el log, que nadie usa nunca.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/gymflow
    username: gymflow
    password: gymflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
  # Detrás de Caddy en producción, la petición le llega al backend en HTTP plano aunque el
  # navegador use HTTPS: sin esto, request.isSecure() daría false y la cabecera HSTS (y
  # cualquier redirección a HTTPS) nunca se enviaría. Caddy ya manda X-Forwarded-* de serie.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gymflow:
  jwt:
    secret: ${GYMFLOW_JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    expiration-minutes: 60
  ai:
    base-url: ${GYMFLOW_AI_BASE_URL:http://localhost:8000}
  cors:
    # Orígenes del frontend con permiso de llamar a la API (coma-separados). En despliegue,
    # cambia esto a la URL pública real del frontend.
    allowed-origins: ${GYMFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    # Administrador real de producción (ProductionAdminSeeder, Trozo 8a-1): vacíos por
    # defecto, solo hacen falta fuera de dev/demo.
    email: ${GYMFLOW_ADMIN_EMAIL:}
    password: ${GYMFLOW_ADMIN_PASSWORD:}
  demo:
    # Despliegue público en modo demo (Trozo 8a-2): contraseñas fuertes de verdad, no las de
    # desarrollo (conocidas, publicadas en el README). Sin prefijo GYMFLOW_ a propósito: así
    # las pide el encargo (DEMO_OWNER_PASSWORD, DEMO_MEMBER_PASSWORD).
    owner-password: ${DEMO_OWNER_PASSWORD:}
    member-password: ${DEMO_MEMBER_PASSWORD:}
