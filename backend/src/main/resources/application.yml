spring:
  application:
    name: gymflow-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/gymflow
    username: gymflow
    password: gymflow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: gymflow
    password: gymflow

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gymflow:
  jwt:
    secret: ${GYMFLOW_JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    expiration-minutes: 60
  ai:
    base-url: ${GYMFLOW_AI_BASE_URL:http://localhost:8000}
